<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="340" viewBox="20 90 1360 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f1"/>
      <stop offset="1" stop-color="#f3eee4"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#b08a3e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, "DejaVu Sans Mono", Menlo, monospace; }
      .title { font-size:26px; font-weight:600; fill:#26253a; }
      .sub   { font-size:15px; fill:#7a7468; }
      .bt    { font-size:18px; font-weight:600; fill:#26253a; }
      .exe   { font-size:13px; fill:#8a8377; }
      .desc  { font-size:14.5px; fill:#4a4757; }
      .alab  { font-size:12.5px; fill:#9a8a68; letter-spacing:0.5px; }
      .cap   { font-size:11px; font-weight:600; letter-spacing:1.6px; fill:#9a8a68; }
      .num   { font-size:12px; font-weight:700; fill:#ffffff; }
    </style>
  </defs>

  <rect x="20" y="90" width="1360" height="340" fill="url(#bg)"/>


  <!-- ===== boxes ===== -->
  <g class="sans">
    <!-- 1 -->
    <rect x="62" y="134" width="230" height="120" rx="12" fill="#000" opacity="0.035"/>
    <rect x="60" y="130" width="230" height="120" rx="12" fill="#ffffff" stroke="#ddd3c1"/>
    <circle cx="84" cy="154" r="11" fill="#2b2a4a"/><text class="num" x="84" y="158.5" text-anchor="middle">1</text>
    <text class="bt" x="104" y="160">Counter-Strike 2</text>
    <text class="mono exe" x="80" y="196">cs2.exe</text>
    <text class="desc" x="80" y="226">You finish a match</text>

    <!-- 2 -->
    <rect x="412" y="134" width="230" height="120" rx="12" fill="#000" opacity="0.035"/>
    <rect x="410" y="130" width="230" height="120" rx="12" fill="#ffffff" stroke="#ddd3c1"/>
    <circle cx="434" cy="154" r="11" fill="#2b2a4a"/><text class="num" x="434" y="158.5" text-anchor="middle">2</text>
    <text class="bt" x="454" y="160">Leetify</text>
    <text class="mono exe" x="430" y="196">public API · online</text>
    <text class="desc" x="430" y="226">Processes the match</text>

    <!-- 3 (the mod, gold accent) -->
    <rect x="762" y="134" width="230" height="120" rx="12" fill="#000" opacity="0.035"/>
    <rect x="760" y="130" width="230" height="120" rx="12" fill="#ffffff" stroke="#c9a24a" stroke-width="1.6"/>
    <circle cx="784" cy="154" r="11" fill="#b08a3e"/><text class="num" x="784" y="158.5" text-anchor="middle">3</text>
    <text class="bt" x="804" y="160">CounterChao</text>
    <text class="mono exe" x="780" y="196">SA2 mod</text>
    <text class="desc" x="780" y="226">Turns stats into rewards</text>

    <!-- 4 -->
    <rect x="1112" y="134" width="230" height="120" rx="12" fill="#000" opacity="0.035"/>
    <rect x="1110" y="130" width="230" height="120" rx="12" fill="#ffffff" stroke="#ddd3c1"/>
    <circle cx="1134" cy="154" r="11" fill="#2b2a4a"/><text class="num" x="1134" y="158.5" text-anchor="middle">4</text>
    <text class="bt" x="1154" y="160">Sonic Adventure 2</text>
    <text class="mono exe" x="1130" y="196">sonic2app.exe</text>
    <text class="desc" x="1130" y="226">Rewards land in your garden</text>
  </g>

  <!-- ===== arrows ===== -->
  <g stroke="#b08a3e" stroke-width="1.8" fill="none" marker-end="url(#ah)">
    <line x1="302" y1="190" x2="396" y2="190"/>
    <line x1="652" y1="190" x2="746" y2="190"/>
    <line x1="1002" y1="190" x2="1096" y2="190"/>
  </g>
  <g class="sans alab" text-anchor="middle">
    <text x="349" y="179">match</text>
    <text x="699" y="179">stats</text>
    <text x="1049" y="179">rewards</text>
  </g>

  <!-- ===== callouts ===== -->
  <g stroke="#cdbf9f" stroke-width="1.2" stroke-dasharray="3 4">
    <line x1="875" y1="252" x2="875" y2="292"/>
    <line x1="1225" y1="252" x2="1225" y2="292"/>
  </g>

  <!-- request (browser style) -->
  <text class="sans cap" x="875" y="308" text-anchor="middle">REQUESTS FROM LEETIFY</text>
  <g>
    <rect x="760" y="318" width="230" height="72" rx="10" fill="#ffffff" stroke="#d6ccb8"/>
    <path d="M760,328 a10,10 0 0 1 10,-10 h210 a10,10 0 0 1 10,10 v8 h-230 z" fill="#efe9dd"/>
    <line x1="760" y1="336" x2="990" y2="336" stroke="#d6ccb8"/>
    <circle cx="773" cy="327" r="3.2" fill="#d3c9b6"/><circle cx="784" cy="327" r="3.2" fill="#d3c9b6"/><circle cx="795" cy="327" r="3.2" fill="#d3c9b6"/>
    <rect x="768" y="346" width="214" height="32" rx="8" fill="#f8f5ef" stroke="#e4dccd"/>
    <rect x="774" y="352" width="40" height="20" rx="5" fill="#2b2a4a"/>
    <text class="mono" x="794" y="366.5" text-anchor="middle" font-size="12" font-weight="700" fill="#e9c97a">GET</text>
    <text class="mono" x="821" y="367" font-size="14" fill="#26253a">/v3/profile/matches</text>
  </g>

  <!-- memory (code block) -->
  <text class="sans cap" x="1225" y="308" text-anchor="middle">WRITES TO GAME MEMORY</text>
  <rect x="1110" y="318" width="230" height="72" rx="10" fill="#2b2a4a"/>
  <text class="mono" x="1225" y="347" text-anchor="middle" font-size="15" fill="#e9c97a">ChaoAnimalSlots</text>
  <text class="mono" x="1225" y="372" text-anchor="middle" font-size="15" fill="#c9cbe0">@ 0x19F6B18</text>
</svg>
